# ローカル実行。既定は DRY_RUN=true（R2 に書かない・パージしない）で、成果物は ./work/<osm|gsi|mapterhorn> に残る
# （WORK_DIR は渡さず、各スクリプトの既定に任せる。./work の置き方は docs/operations.md「作業領域」）。
#   docker compose run --rm pipeline scripts/build-osm.sh
#   docker compose run --rm -e PBF_URL=https://download.geofabrik.de/asia/japan/shikoku-latest.osm.pbf pipeline scripts/build-osm.sh
#
# 書き込みまで含めた試験（docs/operations.md「ローカルで試す」）:
#   docker compose run --rm pipeline scripts/test.sh local   … ① ローカルの S3 互換サーバー（versitygw）に書く
#   docker compose run --rm pipeline scripts/test.sh r2      … ② 本物の R2 の _test/ 以下に書いて最後に消す（.env に認証情報）
services:
  pipeline:
    build: .
    image: japan-basemap-tile-pipeline
    volumes:
      - .:/repo:ro
      - ./work:/work
      # Planetiler の一時ファイルは量が多くランダムアクセスなので、Windows とのバインドマウントに置かない
      - planetiler-tmp:/scratch
    environment:
      PLANETILER_TMP: /scratch
      DRY_RUN: ${DRY_RUN:-true}
      FORCE: ${FORCE:-false}
      JAVA_XMX: ${JAVA_XMX:-10g}
    env_file:
      - path: .env
        required: false
    depends_on:
      - s3
      - testsrc

  # ローカル試験用の S3 互換サーバー（R2 の代わり）。R2 固有の未実装 API は再現しないので、② の R2 試験も必ず行う
  s3:
    image: versity/versitygw:v1.7.0
    command: ["--access", "local", "--secret", "localsecret", "--region", "auto", "--port", ":7070", "posix", "/data"]
    volumes:
      # posix バックエンドはメタデータを xattr に保存するので、Windows とのバインドマウントに置かない
      - s3-data:/data

  # 試験用の配信元（国土地理院の代わりに小さい PMTiles を ETag 付きで返す）。./work/testsrc を公開する
  testsrc:
    image: nginx:1.27.5-alpine
    volumes:
      - ./work/testsrc:/usr/share/nginx/html:ro

volumes:
  planetiler-tmp:
  s3-data:
